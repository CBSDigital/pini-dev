        const _DCC_KEY = 'docs_gen_dcc';
        const _DEFAULT_DCC = 'none' || 'none';
        const _PAGE_DCC = '' || '';
        const _BG_COLS = {
            maya: 'PaleTurquoise',
            nuke: 'PaleGoldenRod',
            hou: 'SandyBrown',
            none: 'white',
        };

        function readDcc() {
            const _params = new URLSearchParams(window.location.search);
            return (
                _params.get('dcc') ||
                localStorage.getItem(_DCC_KEY) ||
                _DEFAULT_DCC ||
                'none');
        }

        function writeDcc(_dcc) {
            localStorage.setItem(_DCC_KEY, _dcc);
            const _url = new URL(window.location.href);
            if (_dcc && _dcc !== 'none') {
                _url.searchParams.set('dcc', _dcc);
            } else {
                _url.searchParams.delete('dcc');
            }
            history.replaceState(null, '', _url);
        }

        function hrefWithDcc(_href, _dcc) {
            const _url = new URL(_href, document.baseURI);
            if (_dcc && _dcc !== 'none') {
                _url.searchParams.set('dcc', _dcc);
            } else {
                _url.searchParams.delete('dcc');
            }
            return _url.href;
        }

        function syncDocsLinks(_dcc) {
            document.querySelectorAll('[data-docs-link]').forEach((_link) => {
                _link.setAttribute(
                    'href', hrefWithDcc(_link.getAttribute('href'), _dcc));
            });
        }

        // Add text filter
        const _filter_field = document.getElementById('TextFilter');
        _filter_field.addEventListener('input', (event) => {
            renderDataInTheTable();
        });
        function ClearTextFilter() {
            document.getElementById("TextFilter").value = "";
            renderDataInTheTable();
        }

        // Same token rules as pini.utils.passes_filter:
        //   render farm     -> match if path contains render OR farm
        //   +render +farm   -> match if path contains render AND farm
        //   render -open_maya -> match render, exclude paths containing open_maya
        function passesFilter(_text, _filter) {
            if (!_filter) {
                return true;
            }
            const _text_l = _text.toLowerCase();
            const _tokens = _filter.toLowerCase().split(/\s+/).filter(Boolean);
            const _match = [];
            const _ignore = [];
            const _required = [];
            _tokens.forEach((_token) => {
                if (_token.startsWith('-') && _token.length > 1) {
                    _ignore.push(_token.slice(1));
                } else if (_token.startsWith('+') && _token.length > 1) {
                    _required.push(_token.slice(1));
                } else if (!_token.startsWith('-') && !_token.startsWith('+')) {
                    _match.push(_token);
                }
            });
            for (const _token of _required) {
                if (!_text_l.includes(_token)) {
                    return false;
                }
            }
            for (const _token of _ignore) {
                if (_text_l.includes(_token)) {
                    return false;
                }
            }
            if (_match.length) {
                return _match.some((_token) => _text_l.includes(_token));
            }
            return true;
        }

        // Add dcc filter (header)
        const _dcc_field = document.getElementById('DccFilter');
        if (_dcc_field) {
            _dcc_field.value = readDcc();
            writeDcc(_dcc_field.value);
            syncDocsLinks(_dcc_field.value);
            _dcc_field.addEventListener('change', (event) => {
                writeDcc(_dcc_field.value);
                syncDocsLinks(_dcc_field.value);
                renderDataInTheTable();
            });
        }

        // Add show inherited members
        const _show_inherited_field = document.getElementById('ShowInherited');
        if (_show_inherited_field) {
            _show_inherited_field.addEventListener('change', (event) => {
                renderDataInTheTable();
            });
        }
        function renderDataInTheTable() {

            const _filter = document.getElementById('TextFilter').value
            const _dcc = _dcc_field ? _dcc_field.value : readDcc()
            const _inh_el = document.getElementById('ShowInherited')
            const _show_inherited = _inh_el ? _inh_el.checked : false
            const _table = document.getElementById("FuncsTable");

            document.body.style.backgroundColor = _BG_COLS[_dcc] || 'white'

            _table.innerHTML = '';
            var _count = 0;
            var _total = 0;

            _objs.forEach(_item => {

                _total += 1;

                const _values = Object.values(_item);
                const _path = _values[4]
                const _item_dcc = _values[5] || ''

                // Apply text filter
                if (!passesFilter(_path, _filter)) {
                    return; }

                // Apply dcc filter:
                //  - untagged entries (eg. pini.utils) always show
                //  - tagged entries (eg. pini.dcc / maya_pini) show only
                //    for the selected dcc
                if (_item_dcc && _item_dcc !== _dcc) {
                    return; }

                // Host-only class pages hide when another host dcc is selected
                if (_PAGE_DCC && _dcc !== 'none' && _dcc !== _PAGE_DCC) {
                    return; }

                var _docs = _values[2]
                var _is_inherited = _docs.includes('Inherited from:')

                if (!_show_inherited && _is_inherited) {
                    return; }

                // Build row (name, location, docs, import)
                _count += 1;
                let _row = document.createElement("tr");
                _values.slice(0, 4).forEach((_value) => {
                    let _cell = document.createElement("td");
                    _cell.innerHTML = _value;
                    _cell.style.verticalAlign = "top";
                    _row.appendChild(_cell);
                })
                _table.appendChild(_row);

            });

            // Update info
            var _info = `(Displaying ${_count}/${_total} items)`;
            const _info_field = document.getElementById("FilterInfo");
            _info_field.innerHTML = _info;
        }

        renderDataInTheTable(_objs);

    </script>

</body>

</html>
