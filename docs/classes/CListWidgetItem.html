    <script type="text/javascript" charset="utf-8">

        var _objs = [
             ['qt.CListWidgetItem', 'pini.qt', '<font color="DarkMagenta"><b>CListWidgetItem(text="", data=None, icon=None, icon_scale=None, col=None)</b></font><br><br><small>&ensp;Constructor</small><br><br><small><font color="DodgerBlue">&ensp;Args</font></small><br>&ensp;<small><b>text</b> (str): item text</small><br>&ensp;<small><b>data</b> (any): item data</small><br>&ensp;<small><b>icon</b> (str): path to item icon</small><br>&ensp;<small><b>icon_scale</b> (float): apply icon scaling</small><br>&ensp;<small><b>col</b> (str|tuple|QColor): item text colour</small><br><br><small>Defined in: <font color="DeepSkyBlue">pini/qt/wrapper/widgets/qw_list_widget_item.py</font></small>', '<small><code>from pini import qt<br>qt.CListWidgetItem</code></small>', 'pini.qt.CListWidgetItem', ''],
             ['qt.CListWidgetItem.data', 'pini.qt', '<font color="DarkMagenta"><b>CListWidgetItem.data(role=None)</b></font><br><br><small>&ensp;Obtain data stored in this item</small><br><br><small><font color="DodgerBlue">&ensp;Args</font></small><br>&ensp;<small><b>role</b> (int): data role</small><br><br><small><font color="DodgerBlue">&ensp;Returns</font></small> <small>(any): stored data</small><br><br><small>Defined in: <font color="DeepSkyBlue">pini/qt/wrapper/widgets/qw_list_widget_item.py</font></small>', '<small><code>from pini import qt<br>qt.CListWidgetItem.data</code></small>', 'pini.qt.CListWidgetItem.data', ''],
             ['qt.CListWidgetItem.set_col', 'pini.qt', '<font color="DarkMagenta"><b>CListWidgetItem.set_col(col)</b></font><br><br><small>&ensp;Set text colour</small><br><br><small><font color="DodgerBlue">&ensp;Args</font></small><br>&ensp;<small><b>col</b> (str|tuple|QColor): colour to apply</small><br><br><small>Defined in: <font color="DeepSkyBlue">pini/qt/wrapper/widgets/qw_list_widget_item.py</font></small>', '<small><code>from pini import qt<br>qt.CListWidgetItem.set_col</code></small>', 'pini.qt.CListWidgetItem.set_col', ''],
             ['qt.CListWidgetItem.set_data', 'pini.qt', '<font color="DarkMagenta"><b>CListWidgetItem.set_data(data)</b></font><br><br><small>&ensp;Set data for this item</small><br><br><small><font color="DodgerBlue">&ensp;Args</font></small><br>&ensp;<small><b>data</b> (any): data to apply</small><br><br><small>Defined in: <font color="DeepSkyBlue">pini/qt/wrapper/widgets/qw_list_widget_item.py</font></small>', '<small><code>from pini import qt<br>qt.CListWidgetItem.set_data</code></small>', 'pini.qt.CListWidgetItem.set_data', ''],
             ['qt.CListWidgetItem.set_icon', 'pini.qt', '<font color="DarkMagenta"><b>CListWidgetItem.set_icon(image, icon_scale=None)</b></font><br><br><small>&ensp;Set item icon</small><br><br><small><font color="DodgerBlue">&ensp;Args</font></small><br>&ensp;<small><b>image</b> (str): path to image</small><br>&ensp;<small><b>icon_scale</b> (float): apply icon scaling</small><br><br><small>Defined in: <font color="DeepSkyBlue">pini/qt/wrapper/widgets/qw_list_widget_item.py</font></small>', '<small><code>from pini import qt<br>qt.CListWidgetItem.set_icon</code></small>', 'pini.qt.CListWidgetItem.set_icon', ''],
         ]

        const _DCC_KEY = 'docs_gen_dcc';
        const _DEFAULT_DCC = 'none' || 'none';
        const _PAGE_DCC = '' || '';
        const _BG_COLS = {
            maya: 'PaleTurquoise',
            nuke: 'PaleGoldenRod',
            hou: 'SandyBrown',
            none: 'white',
        };

        function readDcc() {
            const _params = new URLSearchParams(window.location.search);
            return (
                _params.get('dcc') ||
                localStorage.getItem(_DCC_KEY) ||
                _DEFAULT_DCC ||
                'none');
        }

        function writeDcc(_dcc) {
            localStorage.setItem(_DCC_KEY, _dcc);
            const _url = new URL(window.location.href);
            if (_dcc && _dcc !== 'none') {
                _url.searchParams.set('dcc', _dcc);
            } else {
                _url.searchParams.delete('dcc');
            }
            history.replaceState(null, '', _url);
        }

        function hrefWithDcc(_href, _dcc) {
            const _url = new URL(_href, document.baseURI);
            if (_dcc && _dcc !== 'none') {
                _url.searchParams.set('dcc', _dcc);
            } else {
                _url.searchParams.delete('dcc');
            }
            return _url.href;
        }

        function syncDocsLinks(_dcc) {
            document.querySelectorAll('[data-docs-link]').forEach((_link) => {
                _link.setAttribute(
                    'href', hrefWithDcc(_link.getAttribute('href'), _dcc));
            });
        }

        // Add text filter
        const _filter_field = document.getElementById('TextFilter');
        _filter_field.addEventListener('input', (event) => {
            renderDataInTheTable();
        });
        function ClearTextFilter() {
            document.getElementById("TextFilter").value = "";
            renderDataInTheTable();
        }

        // Add dcc filter (header)
        const _dcc_field = document.getElementById('DccFilter');
        if (_dcc_field) {
            _dcc_field.value = readDcc();
            writeDcc(_dcc_field.value);
            syncDocsLinks(_dcc_field.value);
            _dcc_field.addEventListener('change', (event) => {
                writeDcc(_dcc_field.value);
                syncDocsLinks(_dcc_field.value);
                renderDataInTheTable();
            });
        }

        // Add show inherited members
        const _show_inherited_field = document.getElementById('ShowInherited');
        if (_show_inherited_field) {
            _show_inherited_field.addEventListener('change', (event) => {
                renderDataInTheTable();
            });
        }
        function renderDataInTheTable() {

            const _filter = document.getElementById('TextFilter').value
            const _dcc = _dcc_field ? _dcc_field.value : readDcc()
            const _inh_el = document.getElementById('ShowInherited')
            const _show_inherited = _inh_el ? _inh_el.checked : false
            const _table = document.getElementById("FuncsTable");

            document.body.style.backgroundColor = _BG_COLS[_dcc] || 'white'

            _table.innerHTML = '';
            var _count = 0;
            var _total = 0;

            _objs.forEach(_item => {

                _total += 1;

                const _values = Object.values(_item);
                const _path = _values[4]
                const _item_dcc = _values[5] || ''

                const _path_l = _path.toLowerCase()
                const _filter_l = _filter.toLowerCase()

                // Apply text filter
                if (
                        _filter &&
                        !_path_l.includes(_filter_l)
                ) {
                    return; }

                // Apply dcc filter:
                //  - untagged entries (eg. pini.utils) always show
                //  - tagged entries (eg. pini.dcc / maya_pini) show only
                //    for the selected dcc
                if (_item_dcc && _item_dcc !== _dcc) {
                    return; }

                // Host-only class pages hide when another host dcc is selected
                if (_PAGE_DCC && _dcc !== 'none' && _dcc !== _PAGE_DCC) {
                    return; }

                var _docs = _values[2]
                var _is_inherited = _docs.includes('Inherited from:')

                if (!_show_inherited && _is_inherited) {
                    return; }

                // Build row (name, location, docs, import)
                _count += 1;
                let _row = document.createElement("tr");
                _values.slice(0, 4).forEach((_value) => {
                    let _cell = document.createElement("td");
                    _cell.innerHTML = _value;
                    _cell.style.verticalAlign = "top";
                    _row.appendChild(_cell);
                })
                _table.appendChild(_row);

            });

            // Update info
            var _info = `(Displaying ${_count}/${_total} items)`;
            const _info_field = document.getElementById("FilterInfo");
            _info_field.innerHTML = _info;
        }

        renderDataInTheTable(_objs);

    </script>
